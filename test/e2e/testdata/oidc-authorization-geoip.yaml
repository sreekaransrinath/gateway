# Combines OIDC authentication with an authentication-independent authorization
# deny rule (clientIPGeoLocations) on a GeoIP-enabled Gateway, to verify that
# the geo deny is enforced before the OIDC filter can redirect the client to
# the identity provider. See https://github.com/envoyproxy/gateway/issues/8913
#
# Requires the MaxMind test database ConfigMap `geoip-country-db` (apply
# testdata/authorization-geoip-country.yaml first, or ensureGeoIPConfigMap).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oidc-geoip-authz-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: oidc-geoip-authz-proxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: oidc-geoip-authz-proxy
  namespace: gateway-conformance-infra
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          volumes:
          - name: geoip-db
            configMap:
              name: geoip-country-db
              items:
              - key: GeoIP-Country-Test.mmdb
                path: GeoIP-Country-Test.mmdb
        container:
          volumeMounts:
          - name: geoip-db
            mountPath: /etc/envoy/geoip
            readOnly: true
  geoIP:
    provider:
      type: MaxMind
      maxMind:
        countryDbSource:
          local:
            path: /etc/envoy/geoip/GeoIP-Country-Test.mmdb
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-with-oidc-geo-authz
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: oidc-geoip-authz-gateway
  hostnames: ["www.example.com"]
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /protected-oidc-geo
    backendRefs:
    - name: infra-backend-v1
      port: 8080
---
# Make the test-provided X-Forwarded-For address available to GeoIP / clientCIDRs.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: oidc-geo-authz-client-ip-detection
  namespace: gateway-conformance-infra
spec:
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: oidc-geoip-authz-gateway
---
apiVersion: v1
kind: Secret
metadata:
  namespace: gateway-conformance-infra
  name: oidc-geo-authz-secret
data:
  client-secret: b2lkY3Rlc3QtZm9vLWNsaWVudC1zZWNyZXQ=  # base64 of "oidctest-foo-client-secret"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: oidc-geo-authz
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: http-with-oidc-geo-authz
  # Authentication-independent geo deny: must run before OIDC so a client in a
  # denied country receives 403 instead of a 302 redirect to the IdP.
  authorization:
    defaultAction: Allow
    rules:
    - name: "deny-sanctioned-country"
      action: Deny
      principal:
        clientIPGeoLocations:
        - country: GB
  oidc:
    provider:
      issuer: "https://keycloak.gateway-conformance-infra/realms/master"
      authorizationEndpoint: "http://keycloak.gateway-conformance-infra/realms/master/protocol/openid-connect/auth"
      tokenEndpoint: "http://keycloak.gateway-conformance-infra/realms/master/protocol/openid-connect/token"
      endSessionEndpoint: "https://keycloak.gateway-conformance-infra/realms/master/protocol/openid-connect/logout"
    clientID: "oidctest-foo"
    clientSecret:
      name: "oidc-geo-authz-secret"
    redirectURL: "http://www.example.com/protected-oidc-geo/oauth2/callback"
    logoutPath: "/protected-oidc-geo/logout"
    forwardAccessToken: true
    passThroughAuthHeader: true
  jwt:
    providers:
    - name: "keycloak"  # JWTs from the OIDC flow need validation
      remoteJWKS:
        uri: "http://keycloak.gateway-conformance-infra/realms/master/protocol/openid-connect/certs"
        cacheDuration: 300s
